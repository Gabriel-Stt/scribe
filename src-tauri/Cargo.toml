[package]
name = "scribe"
version = "0.1.0"
description = "Local lecture and meeting capture"
authors = ["Gabriel Steyer"]
edition = "2021"

[lib]
name = "scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture
cpal = "0.15"
hound = "3.5"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Async runtime (Tauri uses tokio internally; we pull it in explicitly for oneshot channels)
tokio = { version = "1", features = ["full"] }

# HTTP client for LLM and ASR sidecar calls
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1"

# Async trait objects
async-trait = "0.1"

# Date / time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4"] }
